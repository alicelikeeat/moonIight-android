name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install SDK 35
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort | tail -n 1)
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
