name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Signing secrets
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Signing secrets missing::No APK was built or published. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD, then re-run this workflow."
          fi

      - uses: actions/checkout@v4
        if: steps.sign.outputs.ready == 'true'

      - uses: actions/setup-java@v4
        if: steps.sign.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK 35
        if: steps.sign.outputs.ready == 'true'
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort | tail -n 1)
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode keystore
        if: steps.sign.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Assemble signed release
        if: steps.sign.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        if: steps.sign.outputs.ready == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$SRC"
          DEST="Yuedan-v${VERSION}.apk"
          cp "$SRC" "$DEST"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$DEST"
          echo "file=$DEST" >> "$GITHUB_OUTPUT"
          sha256sum "$DEST"

      - uses: softprops/action-gh-release@v2
        if: steps.sign.outputs.ready == 'true'
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
          body: |
            月淡 Android ${{ github.ref_name }}。

            安装包使用仓库密钥签名，可覆盖已安装的 v5.0（同一 applicationId 与签名）。
            哔哩哔哩与 YouTube 只走官方嵌入和公开接口，不解析 playurl，不做 WBI 签名，不扒流。
            水滴融合默认关闭。虚拟好友自动发动态默认关闭。

            本工作流只证明 APK 能在 GitHub 上编出来并完成签名。它不是真机手势验收。
